<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>360 Painting Solutions LLC | Interior, Exterior & Commercial Painting</title>
    <meta
      name="description"
      content="360 Painting Solutions LLC offers premium interior painting, exterior painting, commercial painting, and cabinet refinishing. Feel your home with our colour. Request your free quote today!"
    />
    <meta property="og:title" content="360 Painting Solutions LLC | Interior, Exterior & Commercial Painting" />
    <meta
      property="og:description"
      content="Interior, exterior, and commercial painting done right, from first color choice to final coat. Call for a free quote!"
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="360 Painting Solutions LLC" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="360 Painting Solutions LLC | Interior, Exterior & Commercial Painting" />

      name="twitter:description"
      content="Interior, exterior, and commercial painting done right, from first color choice to final coat. Call for a free quote!"

    <!-- Google Fonts: Montserrat (sans-serif) and Caveat (handwritten script for tagline) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap"
      rel="stylesheet"
    />

    <!-- Structured Data (Schema.org) for Local House Painter (No Address) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "HousePainter",
        "name": "360 Painting Solutions LLC",
        "slogan": "Feel your home with our colour",
        "description": "Professional painting contractor offering interior painting, exterior painting, commercial painting, and cabinet & trim refinishing with free quotes.",
        "telephone": "(000) 000-0000",
        "priceRange": "$$",
        "hasOfferCatalog": {
          "@type": "OfferCatalog",
          "name": "Painting Services",
          "itemListElement": [
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Interior Painting",
                "description": "Walls, ceilings, and trim for a fresh, clean look"
              }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Exterior Painting",
                "description": "Durable, weather-resistant finishes that protect your home"
              }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Commercial Painting",
                "description": "Professional, on-schedule painting for offices and businesses"
              }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Cabinet & Trim Painting",
                "description": "Smooth, long-lasting refinishing for kitchens and detail work"
              }
            }
          ]
        }
      }
    </script>
  </head>
  <body class="bg-white text-[#1B2330] font-sans antialiased selection:bg-[#D1202F] selection:text-white">

  </body>
</html>
